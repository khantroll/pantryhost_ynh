#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "pantryhost"
name = "Pantry Host"
description.en = "Self-hosted pantry, grocery list, recipe and kitchen manager"
version = "0.7.0~ynh2"

maintainers = []

[upstream]
license = "MIT"
website = "https://pantryhost.app/"
code = "https://github.com/jpdevries/pantry-host"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = false
disk = "1G"
ram.build = "1G"
ram.runtime = "500M"

[install]

[install.domain]
type = "domain"

[install.init_main_permission]
type = "group"
default = "visitors"

[install.ai_provider]
ask.en = "AI provider"
help.en = "Choose the LLM backend used for optional AI recipe generation."
type = "select"
choices = ["none", "anthropic", "gemini", "mistral", "openai-compatible"]
default = "gemini"

[install.ai_api_key]
ask.en = "AI API key"
type = "password"
optional = true
visible = "ai_provider != 'none'"

[install.ai_model]
ask.en = "AI model (optional)"
help.en = "Leave blank to use the provider adapter's default model."
type = "string"
optional = true
visible = "ai_provider != 'none'"

[install.ai_base_url]
ask.en = "OpenAI-compatible API base URL"
help.en = "Only required for OpenAI-compatible endpoints, such as a local or hosted compatible API."
type = "url"
optional = true
visible = "ai_provider == 'openai-compatible'"

[install.enable_image_processing]
ask.en = "Generate optimized image variants?"
type = "boolean"
default = true

[resources]

[resources.system_user]

[resources.install_dir]

[resources.data_dir]

[resources.permissions]
main.url = "/"

[resources.ports]
main.default = 3000

[resources.ports.graphql]
default = 4001
fixed = true

[resources.nodejs]
version = "22"

[resources.apt]
packages = ["git", "sqlite3"]
