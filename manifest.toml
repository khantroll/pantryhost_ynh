#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "pantryhost"
name = "Pantry Host"
description.en = "Self-hosted pantry, grocery list, recipe and kitchen manager"
version = "0.7.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://pantryhost.app/"
code = "https://github.com/jpdevries/pantry-host"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = false
disk = "1G"
ram.build = "2G"
ram.runtime = "500M"

[install]

[install.domain]
type = "domain"

[install.init_main_permission]
type = "group"
default = "visitors"

[install.ai_api_key]
ask.en = "Anthropic API key (optional)"
type = "password"
optional = true

[install.enable_image_processing]
ask.en = "Generate optimized image variants?"
type = "boolean"
default = true

[resources]

[resources.system_user]

[resources.install_dir]

[resources.data_dir]

[resources.permissions]
main.url = "/"

[resources.ports]
# Rex frontend; nginx is the only public entrypoint.
main.default = 3000

# Pantry Host currently hardcodes localhost:4001 for SSR GraphQL requests.
# Therefore this port must remain fixed until upstream makes the SSR port configurable.
graphql.default = 4001
graphql.fixed = true

[resources.nodejs]
version = "22"

[resources.apt]
packages = ["git", "sqlite3"]
